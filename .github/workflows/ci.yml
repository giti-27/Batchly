name: BATCHLY CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: batchly_user
          POSTGRES_PASSWORD: batchly_pass
          POSTGRES_DB: batchly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements-dev.txt

    - name: Run Test Suite (Postgres Invariants & Benchmark Gate 1)
      env:
        DATABASE_URL: postgresql+psycopg2://batchly_user:batchly_pass@localhost:5432/batchly
      run: |
        pytest api/tests/ -v

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Frontend
      run: |
        cd web
        npm ci
        npm run build
